# Demo config file 
# You can follow this template to create your own config file
# Refer to the config files in the configs/ directory to see all the available options

data:
  dataloader:
    batch_size: 32
  
checkpointing:
  run_name: "pico-decoder-demo-1"
  save_every_n_steps: 50

  save_to_hf: true
  hf_checkpoint:
    repo_id: "pico-lm/demo"

  learning_dynamics:
    batch_size: 16

model:
    d_model: 96
    activation_hidden_dim: 384

evaluation: 
  paloma:
    batch_size: 32

monitoring:

  save_to_wandb: true
  wandb:
    project: "pico-demo"
    entity: "pico-lm"

  # Optional: Enable Pico Labs for experiment tracking
  # Pico Labs is a platform to easily run and share experiments on the web
  # Requires PICO_API_KEY and PICO_LAB_HASH environment variables
  # save_to_picolabs: true
  # pico_report:
  #   lab_hash: "your-lab-hash"  # Optional if PICO_LAB_HASH env var is set

  logging:
    log_every_n_steps: 10

training:
  max_steps: 100

  optimization:
    lr: 0.001
    lr_warmup_steps: 30

    gradient_accumulation_steps: 2
  
  fabric:
    num_devices: 1
